[env:esp32-4848s040]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/55.03.30/platform-espressif32.zip
board = esp32-s3-devkitc-1
framework = arduino
board_build.arduino.memory_type = qio_opi
board_build.flash_mode = dio
board_build.f_flash = 40000000L
board_upload.flash_size = 16MB
board_build.partitions = partitions.csv
build_flags = -Ilib/nofrendo/src -DBOARD_HAS_PSRAM -DARDUINO_USB_CDC_ON_BOOT=0
lib_deps = moononournation/GFX Library for Arduino @ 1.6.4
monitor_speed = 115200
