[env:esp32-4848s040]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/55.03.30/platform-espressif32.zip
board = esp32-s3-devkitc-1
framework = arduino
board_build.arduino.memory_type = qio_opi
; SDK bootloader ELF uses qio; final merged image is patched to DIO 40 MHz in CI.
board_build.flash_mode = qio
board_upload.flash_size = 16MB
board_build.partitions = partitions.csv
board_build.f_cpu = 240000000L
build_flags = -Ilib/nofrendo/src -DBOARD_HAS_PSRAM -DARDUINO_USB_CDC_ON_BOOT=0
build_src_filter = +<*> -<md_core.c> -<dos_smoke.cpp> -<dos_runtime.cpp>
lib_deps = moononournation/GFX Library for Arduino @ 1.6.4
monitor_speed = 115200

[env:esp32-4848s040-dos]
extends = env:esp32-4848s040
board_build.partitions = partitions_dos.csv
build_src_filter = -<*> +<dos_smoke.cpp>
lib_deps =
    ${env:esp32-4848s040.lib_deps}
    https://github.com/moononournation/Faux86-remake.git#03fe2009debd2c5fd295b131ac6afea275e1ce0f
    https://github.com/adafruit/Adafruit_Faux86.git#aa3d577a462e1000777b0155e70f81e27eea44c2
lib_ldf_mode = deep+

[env:esp32-4848s040-combined]
extends = env:esp32-4848s040-dos
board_build.partitions = partitions_combined.csv
build_src_filter = +<*> -<md_core.c> -<dos_smoke.cpp>
build_flags = ${env:esp32-4848s040.build_flags} -DPRISMA_COMBINED
