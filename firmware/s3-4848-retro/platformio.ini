[env:esp32-4848s040]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/55.03.30/platform-espressif32.zip
board = esp32-s3-devkitc-1
framework = arduino
board_build.arduino.memory_type = qio_opi
; SDK bootloader ELF uses qio; final merged image is patched to DIO 40 MHz in CI.
board_build.flash_mode = qio
board_upload.flash_size = 16MB
board_build.partitions = partitions.csv
board_build.f_cpu = 240000000L
build_flags = -Ilib/nofrendo/src -Ilib/gwenesis -Ilib/gwenesis/src/bus -Ilib/gwenesis/src/cpus/M68K -Ilib/gwenesis/src/cpus/Z80 -Ilib/gwenesis/src/io -Ilib/gwenesis/src/savestate -Ilib/gwenesis/src/sound -Ilib/gwenesis/src/vdp -DBOARD_HAS_PSRAM -DARDUINO_USB_CDC_ON_BOOT=0
lib_deps = moononournation/GFX Library for Arduino @ 1.6.4
monitor_speed = 115200
