                TEST(flag_szp8,x);TEST(flag_log8,x);
                for(unsigned y=0;y<256;++y){
                  TEST(flag_add8,x,y);TEST(flag_sub8,x,y);
                  for(unsigned c=0;c<2;++c){TEST(flag_adc8,x,y,c);TEST(flag_sbb8,x,y,c);}
                }
              }
              std::mt19937 rng(54);
              for(unsigned i=0;i<1000000;++i){
                uint16_t x=rng(),y=rng();TEST(flag_add16,x,y);TEST(flag_sub16,x,y);
                for(unsigned c=0;c<2;++c){TEST(flag_adc16,x,y,c);TEST(flag_sbb16,x,y,c);}
              }
              for(unsigned x: {0u,1u,0xfu,0x10u,0x7fffu,0x8000u,0xffffu})
                for(unsigned y: {0u,1u,0xfu,0x10u,0x7fffu,0x8000u,0xffffu}){
                  TEST(flag_add16,x,y);TEST(flag_sub16,x,y);
                  for(unsigned c=0;c<2;++c){TEST(flag_adc16,x,y,c);TEST(flag_sbb16,x,y,c);}
                }
              std::printf("PRISMA 054 flags equivalent: %u checks\n",checks);
          }
          '''
          from pathlib import Path
          import subprocess
          Path("/tmp/prisma054-flags.cpp").write_text(test)
          subprocess.run(["g++","-O2","-std=c++17","/tmp/prisma054-flags.cpp","-o","/tmp/prisma054-flags"],check=True)
          subprocess.run(["/tmp/prisma054-flags"],check=True)
          src=src[:a]+after+src[b:]
          old="static const uint8_t parity[0x100]"
          assert src.count(old)==1
          src=src.replace(old,"static DRAM_ATTR const uint8_t parity[0x100]",1)
          p.write_text(src)
          # 050: bounded IRAM experiment. Move only the original ModR/M
          # decoder into one non-inlined function; avoid moving the giant
          # exec86 dispatcher or allocating any additional guest RAM.
          p=path("CPU.h","void exec86(uint32_t execloops")
          edit(p,[("    void exec86(uint32_t execloops, uint16_t timing_interval);","    void exec86(uint32_t execloops, uint16_t timing_interval);\n    void prismaDecodeModrm();")])
          p=path("CPU.cpp","prismaDeadline")
          src=p.read_text()
          old="void CPU::exec86(uint32_t execloops, uint16_t timing_interval)"
          assert src.count(old)==1
          src=src.replace(old,"""#ifndef CPU_ADDR_MODE_CACHE
          void IRAM_ATTR __attribute__((noinline,noclone)) CPU::prismaDecodeModrm()
          {
            addrbyte=getmem8(segregs[regcs],ip);StepIP(1);
            mode=addrbyte>>6;reg=(addrbyte>>3)&7;rm=addrbyte&7;
            // Register-only operands are independent of segment selection.
            if(mode==3){disp8=0;disp16=0;return;}
            // Preserve original displacement and stack-segment semantics.
            if(mode==1){disp16=signext(getmem8(segregs[regcs],ip));StepIP(1);}
            else if(mode==2||rm==6){disp16=getmem16(segregs[regcs],ip);StepIP(2);}
            if(!segoverride&&(rm==2||rm==3||(rm==6&&mode!=0)))useseg=segregs[regss];
          }
          #undef modregrm
          #define modregrm() prismaDecodeModrm()
          #endif

          """+old,1)
          p.write_text('#include <esp_attr.h>\n'+src)
          # Pace physical keyboard scancodes after actual guest port reads.
          p=path("InputManager.h","prismaReadCount")
          edit(p,[("    uint32_t prismaReadCount = 0;","    uint32_t prismaReadCount = 0;\n    uint32_t prismaSentCount = 0;\n    uint32_t prismaNextKeyUs = 0;")])
          p=path("InputManager.cpp","void InputManager::tick")
          edit(p,[
              ("  if (!keyboardWaitAck && keyboardBufferSize > 0)","  if (!keyboardWaitAck && keyboardBufferSize > 0 && !(vm.pic.isr & 2) && int32_t(uint32_t(esp_timer_get_time())-prismaNextKeyUs)>=0)"),
              ("    keyboardWaitAck = true;","    keyboardWaitAck = true;\n    prismaNextKeyUs=uint32_t(esp_timer_get_time())+5000;\n    ++prismaSentCount;"),
          ])
          p.write_text('#include <esp_timer.h>\n'+p.read_text())
          # For direct taps, ask the installed DOS mouse driver to position
          # its own cursor, then replay the original INT 33h query. Only
          # active on an explicit touch request, never an extra CPU loop.
          p=path("CPU.h","uint8_t didbootstrap")
          edit(p,[("    uint8_t didbootstrap = 0;","""    uint8_t didbootstrap = 0;
              bool prismaMouseEnabled=false,prismaMousePending=false,prismaMouseInCall=false;
              uint16_t prismaMouseX=0,prismaMouseY=0;
              uint32_t prismaMouseApplied=0,prismaMouseQueries=0;
              uint16_t prismaMouseMinX=0,prismaMouseMaxX=639,prismaMouseMinY=0,prismaMouseMaxY=199;
              bool prismaMouseRangeY=false;
              uint16_t prismaMouseSavedRegs[8],prismaMouseSavedES,prismaMouseSavedDS,prismaMouseSavedSS,prismaMouseSavedCS,prismaMouseSavedIP,prismaMouseSavedFlags;
              void prismaMouseReturn();""")])
          p=path("CPU.cpp","prismaDeadline")
          edit(p,[
              ("void CPU::intcall86(uint8_t intnum)\n{","""void CPU::prismaMouseReturn(){
                if(!prismaMouseInCall || segregs[regcs]!=prismaMouseSavedCS || ip!=prismaMouseSavedIP ||
                   segregs[regss]!=prismaMouseSavedSS || regs.wordregs[regsp]!=prismaMouseSavedRegs[regsp]) return;
                for(unsigned i=0;i<8;i++)regs.wordregs[i]=prismaMouseSavedRegs[i];
                segregs[reges]=prismaMouseSavedES;segregs[regds]=prismaMouseSavedDS;
                decodeflagsword(prismaMouseSavedFlags);
                prismaMouseInCall=false;prismaMousePending=false;++prismaMouseApplied;
                intcall86(0x33);
              }
              void CPU::intcall86(uint8_t intnum)
              {
                if(intnum==0x33 && prismaMouseEnabled && !prismaMouseInCall){
                  const uint16_t fn=regs.wordregs[regax];
                  if(fn==0 || fn==0x21){prismaMouseMinX=prismaMouseMinY=0;prismaMouseMaxX=639;prismaMouseMaxY=199;prismaMouseRangeY=false;}
                  if(fn==7){prismaMouseMinX=regs.wordregs[regcx];prismaMouseMaxX=regs.wordregs[regdx];}
                  if(fn==8){prismaMouseMinY=regs.wordregs[regcx];prismaMouseMaxY=regs.wordregs[regdx];prismaMouseRangeY=true;}
                  if(fn==3||fn==5||fn==6){
                    ++prismaMouseQueries;
                    if(prismaMousePending && (getmem16(0,0xcc)||getmem16(0,0xce))){
                      for(unsigned i=0;i<8;i++)prismaMouseSavedRegs[i]=regs.wordregs[i];
                      prismaMouseSavedES=segregs[reges];prismaMouseSavedDS=segregs[regds];
                      prismaMouseSavedSS=segregs[regss];prismaMouseSavedCS=segregs[regcs];prismaMouseSavedIP=ip;prismaMouseSavedFlags=makeflagsword();
                      unsigned maxY=prismaMouseMaxY;
                      if(!prismaMouseRangeY){unsigned m=vm.memory.readByte(0x449)&0x7f;if(m==0x10||m==0x0f)maxY=349;else if(m==0x11||m==0x12)maxY=479;}
                      unsigned minX=prismaMouseMinX,maxX=prismaMouseMaxX,minY=prismaMouseMinY;
                      if(maxX<minX)maxX=minX;if(maxY<minY)maxY=minY;
                      regs.wordregs[regax]=4;
                      regs.wordregs[regcx]=minX+(uint32_t(prismaMouseX)*(maxX-minX))/65535;
                      regs.wordregs[regdx]=minY+(uint32_t(prismaMouseY)*(maxY-minY))/65535;
                      prismaMouseInCall=true;
                    }
                  }
                }"""),
              ("    case 0xCA: /* CA RETF Iw */\n      oper1 = getmem16(segregs[regcs], ip);\n      ip = pop();\n      segregs[regcs] = pop();\n      regs.wordregs[regsp] = regs.wordregs[regsp] + oper1;\n      if (vm.debugger)\n        vm.debugger->onReturn(segaddr(segregs[regcs], ip));","    case 0xCA: /* CA RETF Iw */\n      oper1 = getmem16(segregs[regcs], ip);\n      ip = pop();\n      segregs[regcs] = pop();\n      regs.wordregs[regsp] = regs.wordregs[regsp] + oper1;\n      if(prismaMouseInCall)prismaMouseReturn();\n      if (vm.debugger)\n        vm.debugger->onReturn(segaddr(segregs[regcs], ip));"),
              ("      decodeflagsword(pop());\n      if (vm.debugger)\n        vm.debugger->onReturn(segaddr(segregs[regcs], ip));","      decodeflagsword(pop());\n      if(prismaMouseInCall)prismaMouseReturn();\n      if (vm.debugger)\n        vm.debugger->onReturn(segaddr(segregs[regcs], ip));"),
          ])
          print("Faux86 042 input patches applied")
