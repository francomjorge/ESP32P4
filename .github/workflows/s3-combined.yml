      - name: Test ModRM decode equivalence
        run: |
          python - <<'PY'
          # Compare the original switch-based decoder with the compact path.
          # Track segment selection, displacement state and consumed bytes.
          def original(b,d,disp8,disp16,override):
              mode,reg,rm=b>>6,(b>>3)&7,b&7
              ss=False;consumed=1
              if mode==0:
                  if rm==6: disp16=d;consumed+=2
                  if rm in (2,3) and not override: ss=True
              elif mode in (1,2):
                  if mode==1:
                      v=d&255;disp16=(v if v<128 else v-256)&65535;consumed+=1
                  else: disp16=d;consumed+=2
                  if rm in (2,3,6) and not override: ss=True
              else: disp8=disp16=0
              return mode,reg,rm,disp8,disp16,ss,consumed
          def compact(b,d,disp8,disp16,override):
              mode,reg,rm=b>>6,(b>>3)&7,b&7
              ss=False;consumed=1
              if mode==3:return mode,reg,rm,0,0,ss,consumed
              if mode==1:
                  v=d&255;disp16=(v if v<128 else v-256)&65535;consumed+=1
              elif mode==2 or rm==6: disp16=d;consumed+=2
              if not override and (rm in (2,3) or (rm==6 and mode!=0)):ss=True
              return mode,reg,rm,disp8,disp16,ss,consumed
          n=0
          for b in range(256):
              for d in list(range(256))+[0x100,0x7fff,0x8000,0xff00,0xffff]:
                  for override in (False,True):
                      assert original(b,d,0x5a,0xabcd,override)==compact(b,d,0x5a,0xabcd,override)
                      n+=1
          print("PRISMA 053 ModRM equivalence:",n,"cases")
          PY
