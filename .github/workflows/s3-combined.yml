      - name: Prepare DOS preview art
        run: |
          python - <<'PY'
          from pathlib import Path
          from urllib.request import urlopen,Request
          from io import BytesIO
          from PIL import Image,ImageOps
          from urllib.parse import quote
          urls=[
          ["https://bestdosgames.com/uploads/2025/02/1578887-where-in-the-world-is-carmen-sandiego-dos-bangkok-main-screen.png"],
          ["https://bestdosgames.com/uploads/2024/11/incredible_machine_5_5f32257990.png"],
          ["https://thumbnails.libretro.com/DOS/Named_Boxarts/Indiana Jones and the Last Crusade_ The Action Game.png","https://gcp-na-images.contentstack.com/v3/assets/bltea6093859af6183b/blt4d8b6cf4e2c3bd4f/6987798235ba6f4887c06737/indiana-jones-and-the-last-crusade.jpg"],
          ["https://cdn2.bestdosgames.com/prod/uploads/2024/11/Indiana_Jones_and_the_Temple_of_Doom_3_ac155465a5.jpeg"],
          ["https://thumb.wikimedia.org/wikipedia/commons/thumb/7/71/MS-DOS_logo.svg/250px-MS-DOS_logo.svg.png"]
          ]
          out=["#pragma once","#include <stdint.h>","namespace DosArt {"]
          entries=[]
          for i,options in enumerate(urls):
            im=None
            for url in options:
              try:
                with urlopen(Request(quote(url,safe=":/%"),headers={"User-Agent":"PrismaRetro/040 (preview artwork)"}),timeout=12) as f:
                  im=Image.open(BytesIO(f.read())).convert("RGBA")
                print("DOS ART READY",i,url)
                break
              except Exception as e: print("DOS ART unavailable",i,str(e))
            if im is None:
              entries.append("nullptr");continue
            for w,h,suffix in [(112,66,"small"),(288,180,"large")]:
              bg=Image.new("RGB",(w,h),(8,12,20))
              im2=ImageOps.contain(im,(w,h),Image.Resampling.NEAREST)
              bg.paste(im2,((w-im2.width)//2,(h-im2.height)//2),im2)
              vals=[(r>>3)<<11|(g>>2)<<5|(b>>3) for r,g,b in bg.getdata()]
              out.append("static const uint16_t "+suffix+str(i)+"[]={")
              out.extend(",".join(hex(v) for v in vals[j:j+32])+"," for j in range(0,len(vals),32))
              out.append("};")
            entries.append(str(i))
          for suffix in ["small","large"]:
            out.append("static const uint16_t *const "+suffix+"[]={"+",".join(suffix+i if i!="nullptr" else i for i in entries)+"};")
          out.append("}")
          Path("src/dos_art.h").write_text("\n".join(out)+"\n")
          PY
      - run: pio run -e esp32-4848s040-combined
      - name: Merge factory image
        run: |
          set -eux
          B=.pio/build/esp32-4848s040-combined
          mkdir -p dist
          /tmp/prisma-esp-venv/bin/python -I -m esptool --chip esp32s3 merge-bin --flash-size 16MB --flash-mode dio --flash-freq 40m -o dist/PRISMA-RETRO-S3-041-merged.bin 0x0 "$B/bootloader.bin" 0x8000 "$B/partitions.bin" 0x10000 "$B/firmware.bin"
          cp "$B/firmware.bin" dist/PRISMA-RETRO-S3-041-app.bin
          cp "$B/firmware.elf" dist/PRISMA-RETRO-S3-041.elf
          if [ -f "$B/firmware.map" ]; then cp "$B/firmware.map" dist/; fi
          python - <<'PY'
          from pathlib import Path
          p=Path("dist/PRISMA-RETRO-S3-041-merged.bin").read_bytes()
          assert p[0]==0xe9 and p[2]==2 and p[3]==0x40, p[:4].hex()
          assert p[0x8000:0x8002]==b"\xaa\x50"
          assert p[0x10000]==0xe9
          print("RAW ESP32-S3 image verified:",len(p),"bytes")
          PY
          (cd dist && sha256sum *.bin > SHA256SUMS.txt)
