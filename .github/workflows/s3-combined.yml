name: S3 Retro - build 041 combined
on:
  push:
    branches: [build-032-dos-nes]
    paths:
      - 'firmware/s3-4848-retro/**'
      - '.github/workflows/s3-combined.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: firmware/s3-4848-retro
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install platformio==6.1.18
      - run: |
          python -m venv /tmp/prisma-esp-venv
          /tmp/prisma-esp-venv/bin/pip install esptool==5.0.1 click==8.1.8
          /tmp/prisma-esp-venv/bin/python -I -m esptool version
      - run: curl -fL --retry 3 https://raw.githubusercontent.com/deltabeard/Peanut-GB/d0bcca771c83a2638c93a9ae61f3d51f226dc905/peanut_gb.h -o src/peanut_gb.h
      - run: python tools/prepare_roms.py
      - run: pip install Pillow==11.3.0
      - run: python tools/prepare_previews.py
      - run: bash tools/prepare_nes.sh
      - name: Install platform and fix esptool executable resolution
        run: |
          pio pkg install -e esp32-4848s040-combined
          /tmp/prisma-esp-venv/bin/python -I -m esptool version
          python - <<'PY'
          from pathlib import Path
          import sys
          import os
          wrapper = Path("/tmp/prisma-esptool")
          wrapper.write_text('#!/bin/sh\nexec /tmp/prisma-esp-venv/bin/python -I -m esptool "$@"\n')
          wrapper.chmod(0o755)
          for p in (Path.home()/".platformio/platforms").glob("espressif32*/builder/main.py"):
              s = p.read_text()
              old = "esptool_binary_path = install_esptool()"
              if old not in s:
                  raise SystemExit("Unexpected platform builder: " + str(p))
              p.write_text(s.replace(old, 'esptool_binary_path = "/tmp/prisma-esptool"'))
          PY
      - name: Fix Arduino_GFX rotation 0 pixel writes
        run: python tools/patch_gfx.py
      - name: Patch Faux86 CPU scheduling and VGA renderer
        run: |
          python - <<'PY'
          from pathlib import Path
          root=Path(".pio/libdeps/esp32-4848s040-combined")
          def path(name, marker):
              matches=[p for p in root.rglob(name) if marker in p.read_text(errors="ignore")]
              assert len(matches)==1, (name,matches)
              return matches[0]
          def edit(p, pairs):
              s=p.read_text()
              for old,new in pairs:
                  assert s.count(old)==1,(p,old,s.count(old))
                  s=s.replace(old,new,1)
              p.write_text(s)
          p=path("CPU.cpp","CPU::exec86(uint32_t execloops")
          edit(p,[
              ("void CPU::exec86(uint32_t execloops, uint16_t timing_interval)\n{","void CPU::exec86(uint32_t execloops, uint16_t timing_interval)\n{\n  const int64_t prismaDeadline = esp_timer_get_time() + 12000;"),
              ("    if ((totalexec & timing_interval) == 0)\n      vm.timing.tick();","    if ((loopcount & timing_interval) == 0) {\n      if (loopcount && esp_timer_get_time() >= prismaDeadline) return;\n      vm.timing.tick();\n    }"),
          ])
          p.write_text('#include <esp_timer.h>\n'+p.read_text())
          p=path("Timing.cpp","TimingScheduler::tick(bool bSkipDraw)")
          edit(p,[
              ("    curscanline = (curscanline + 1) % 525;","    const uint64_t elapsedLines = (curtick-lastscanlinetick)/scanlinetiming;\n    curscanline = (curscanline + elapsedLines) % 525;"),
              ("    lastscanlinetick = curtick - (curtick - (lastscanlinetick + scanlinetiming));","    lastscanlinetick += elapsedLines * scanlinetiming;"),
              ("    lastdrawtick = curtick - (curtick - (lastdrawtick + drawticks));","    lastdrawtick = curtick;"),
              ("    lastvgacursortick = curtick - (curtick - (lastvgacursortick + vgacursorticks));","    lastvgacursortick = curtick;"),
          ])
          p=path("Video.cpp","Video::vga_drawCallback")
          edit(p,[
              ("  // if (!updatedscreen) return;","  if (!updatedscreen) return;\n  updatedscreen = false;"),
              ("  vga_cursor_blink_state ^= 1;","  vga_cursor_blink_state ^= 1;\n  if (!(vga_gfxd[0x06] & 1)) updatedscreen = true;"),
              ("void Video::vga_writememory(void *dummy, uint32_t addr, uint8_t value)\n{","void Video::vga_writememory(void *dummy, uint32_t addr, uint8_t value)\n{\n  updatedscreen = true;"),
              ("bool Video::portWriteHandler(uint16_t portnum, uint8_t value)\n{","bool Video::portWriteHandler(uint16_t portnum, uint8_t value)\n{\n  updatedscreen = true;"),
          ])
          p=path("InputManager.h","MaxKeyboardBufferSize")
          edit(p,[
              ("    void tick();","    void tick();\n    int freeSlots() const { return MaxKeyboardBufferSize - keyboardBufferSize; }"),
              ("MaxKeyboardBufferSize = 32;","MaxKeyboardBufferSize = 256;"),
          ])
          p=path("CPU.cpp","prismaDeadline")
          edit(p,[("      vm.timing.tick();\n    }","      vm.input.tick();\n      vm.timing.tick();\n    }")])
          p.write_text('#pragma GCC optimize ("O3")\n'+p.read_text())
          p=path("Ram.cpp","Memory::readWord")
          edit(p,[
              ("  return ((uint16_t)readByte(addr32) | (uint16_t)(readByte(addr32 + 1) << 8));","  addr32 &= MEMORY_MASK;\n  if (vm.cpu.didbootstrap && (addr32 < 0x9ffff || (addr32 >= 0xc0000 && addr32 < MEMORY_MASK)))\n    return uint16_t(RAM[addr32]) | (uint16_t(RAM[addr32+1]) << 8);\n  return ((uint16_t)readByte(addr32) | (uint16_t)(readByte(addr32 + 1) << 8));"),
          ])
          p.write_text('#pragma GCC optimize ("O3")\n'+p.read_text())
          p=path("Video.cpp","Video::vga_renderThread")
          p.write_text('#pragma GCC optimize ("O3")\n'+p.read_text())
          p=path("SerialMouse.cpp","SerialMouse::triggerEvent")
          edit(p,[
              ("  bufsermousedata(0x40 | highbits | (buttons << 4));","  if (bufptr > MOUSE_BUFFER_LEN - 3) return;\n  bufsermousedata(0x40 | highbits | (buttons << 4));"),
          ])
          p=path("InputManager.h","MaxKeyboardBufferSize")
          edit(p,[
              ("    void markKeyEventHandled() { keyboardWaitAck = false; }","    uint32_t prismaReadCount = 0;\n    void markKeyEventHandled() { if (keyboardWaitAck) ++prismaReadCount; keyboardWaitAck = false; }"),
          ])
          p=path("PIC.cpp","uint8_t PIC::nextintr()")
          edit(p,[("    vm.input.markKeyEventHandled();\n  }\n  // return the next interrupt number","    // PRISMA: ACK on actual port 60 read, not IRQ dispatch.\n  }\n  // return the next interrupt number")])
          p=path("Ports.cpp","uint8_t Ports::inByte")
          edit(p,[("  case 0x60:\n  case 0x61:\n  case 0x63:","  case 0x60:\n    vm.input.markKeyEventHandled();\n    portram[0x64] &= ~3;\n    return portram[0x60];\n  case 0x61:\n  case 0x63:")])
          p=path("InputManager.cpp","void InputManager::tick")
          edit(p,[("    vm.ports.portram[0x64] |= 2;","    vm.ports.portram[0x64] |= 1;")])
          p=path("Video.h","uint8_t updatedscreen;")
          edit(p,[("    uint8_t updatedscreen;","    uint8_t updatedscreen;\n    bool prismaDrawDue = false;\n    uint32_t prismaRenderUs = 0;")])
          p=path("Timing.cpp","TimingScheduler::tick(bool bSkipDraw)")
          edit(p,[("    vm.video.vga_drawCallback(0);","    vm.video.prismaDrawDue = true;")])
          p=path("Video.cpp","Video::vga_drawCallback")
          edit(p,[
              ("  vga_doRender = 1;\n  vga_doBlit = 1;\n  vga_renderThread(0);","""  // Legacy CGA modes have exactly 80 bytes per scanline, split into even/odd 8 KiB banks.
            const uint8_t biosMode = vm.memory.RAM[0x449] & 0x7f;
            if ((vga_gfxd[0x06] & 0x0d) == 0x0d && biosMode >= 4 && biosMode <= 6) {
              const bool mono = biosMode == 6;
              const unsigned width = mono ? 640 : 320;
              const unsigned start = (((unsigned)vga_crtcd[0x0c] << 8) | vga_crtcd[0x0d]) * 2;
              uint16_t pal[4];
              for (unsigned c=0;c<4;++c) {
                unsigned index = vga_attrd[c] | ((vga_attrd[0x14] & 12) << 4);
